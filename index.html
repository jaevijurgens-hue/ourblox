<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurBlox Engine v1.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui">
        <h2>OURBLOX ALPHA</h2>
        <p><strong>Left Click + Drag:</strong> Rotate Studio Camera</p>
        <p><strong>Right Click + Drag:</strong> Pan Camera</p>
        <p><strong>Scroll Wheel:</strong> Zoom In / Out</p>
        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
        <p><strong>Double Click:</strong> Place Studio Block</p>
        <p><strong>Ctrl + Double Click:</strong> Delete Block</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
